/admin/biometric/devices:
  get:
    operationId: listBiometricDevices
    tags: [Biometric]
    summary: List registered biometric devices
    responses:
      '200':
        description: List of devices
  post:
    operationId: registerBiometricDevice
    tags: [Biometric]
    summary: Register a new biometric device
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, device_id]
            properties:
              name: { type: string }
              device_id: { type: string }
              ip_address: { type: string }
    responses:
      '201':
        description: Device registered

/admin/biometric/devices/{id}:
  put:
    operationId: updateBiometricDevice
    tags: [Biometric]
    summary: Update biometric device configuration
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              ip_address: { type: string }
              status: { type: string, enum: [active, inactive] }
    responses:
      '200':
        description: Device updated

/admin/biometric/logs:
  get:
    operationId: listBiometricLogs
    tags: [Attendance]
    summary: List recent biometric attendance logs
    responses:
      '200':
        description: List of logs
    parameters:
      - name: date
        in: query
        schema: { type: string, format: date }
      - name: student_id
        in: query
        schema: { type: string, format: uuid }

/admin/biometric/sync:
  post:
    operationId: syncBiometricData
    tags: [Biometric]
    summary: Trigger biometric data sync
    responses:
      '200':
        description: Sync process started

/admin/biometric/ingest:
  post:
    operationId: ingestBiometricLog
    tags: [Biometric]
    summary: Ingest logs from biometric attendance devices
    description: |
      Endpoints for hardware devices or integration scripts to post attendance logs.
      Requires tenant-specific authentication.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_id, log_time, identifier]
            properties:
              device_id: { type: string, example: "DEVICE_001" }
              log_time: { type: string, format: date-time }
              identifier: { type: string, description: "Card ID or Biometric ID" }
              direction: { type: string, enum: [in, out] }
    responses:
      '200':
        description: Log processed
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, format: uuid }
                status: { type: string }
