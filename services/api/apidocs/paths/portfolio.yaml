# Portfolio & Analytics API Paths — Cross-campus analytics, Student portfolios

/admin/portfolio/groups:
  get:
    operationId: listPortfolioGroups
    tags: [Portfolio]
    summary: List trust/group entities
    responses:
      '200':
        description: List of groups
  post:
    operationId: createPortfolioGroup
    tags: [Portfolio]
    summary: Create a new multi-school group
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: string }
    responses:
      '201':
        description: Group created

/admin/portfolio/groups/{id}/members:
  get:
    operationId: listGroupMembers
    tags: [Portfolio]
    summary: List schools in a portfolio group
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: List of member tenants
  post:
    operationId: addGroupMember
    tags: [Portfolio]
    summary: Add a school (tenant) to a group
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tenant_id]
            properties:
              tenant_id: { type: string, format: uuid }
    responses:
      '201':
        description: Member added

/admin/portfolio/groups/{id}/analytics:
  get:
    operationId: getGroupAnalytics
    tags: [Portfolio]
    summary: Get aggregated group analytics
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Group analytics data

/admin/portfolio/groups/{id}/financial-analytics:
  get:
    operationId: getGroupFinancialAnalytics
    tags: [Portfolio]
    summary: Get aggregated group financial performance
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Group financial data

/admin/portfolio/analytics:
  get:
    operationId: getCampusAnalytics
    tags: [Portfolio]
    summary: Get cross-campus performance analytics
    responses:
      '200':
        description: Analytical data

/admin/portfolio/students/{id}/growth:
  get:
    operationId: getStudentGrowthChart
    tags: [Portfolio]
    summary: Get student academic growth trends
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Growth trend data

/admin/portfolio/achievements:
  get:
    operationId: listSignificantAchievements
    tags: [Portfolio]
    summary: List significant achievements across school
    responses:
      '200':
        description: Achievement list
  post:
    operationId: recordAchievement
    tags: [Portfolio]
    summary: Record a student/staff achievement
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_id, title, date]
            properties:
              user_id: { type: string, format: uuid }
              title: { type: string }
              description: { type: string }
              date: { type: string, format: date }
    responses:
      '201':
        description: Achievement recorded
